name: Structured Battle Arena validation

on:
  push:
    branches:
      - codex/structured-battle-arena

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Prepare portable hosting config
        run: |
          mkdir -p .openai
          printf '%s\n' '{"d1":"DB","r2":null}' > .openai/hosting.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm build
      - name: Migration smoke test
        run: |
          python3 - <<'PY'
          import sqlite3, pathlib
          db = sqlite3.connect(":memory:")
          db.executescript("""
          CREATE TABLE votes (
            battle text NOT NULL,
            user text NOT NULL,
            side text NOT NULL,
            reason text NOT NULL,
            evidence text NOT NULL,
            created integer NOT NULL,
            PRIMARY KEY (battle, user)
          );
          INSERT INTO votes VALUES ('legacy-battle','legacy-user','a','legacy reason','legacy source',1);
          """)
          sql = pathlib.Path("drizzle/0002_structured_battle_arena.sql").read_text()
          sql = sql.replace("--> statement-breakpoint", "")
          db.executescript(sql)
          row = db.execute("SELECT battle,user,side,difficulty FROM votes").fetchone()
          assert row == ('legacy-battle','legacy-user','a',None), row
          db.execute("""
            INSERT INTO votes (battle,user,side,difficulty,reason,evidence,created)
            VALUES (?,?,?,?,?,?,?)
            ON CONFLICT(battle,user) DO UPDATE SET
              side=excluded.side,
              difficulty=excluded.difficulty,
              reason=excluded.reason,
              evidence=excluded.evidence,
              created=excluded.created
          """, ('legacy-battle','legacy-user','b','high','updated reason','updated source',2))
          rows = db.execute("SELECT battle,user,side,difficulty FROM votes").fetchall()
          assert rows == [('legacy-battle','legacy-user','b','high')], rows
          db.execute("""
            INSERT INTO argument_evidence
              (id,battle,argument_user,contributor,reference,context,created)
            VALUES (?,?,?,?,?,?,?)
          """, ('ev1','legacy-battle','legacy-user','helper','episode 7','context',3))
          assert db.execute("SELECT COUNT(*) FROM argument_evidence").fetchone()[0] == 1
          print("migration smoke test passed")
          PY
