name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: anime
          POSTGRES_PASSWORD: anime
          POSTGRES_DB: anime_clash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anime -d anime_clash"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://anime:anime@localhost:5432/anime_clash
      TEST_DATABASE_URL: postgresql://anime:anime@localhost:5432/anime_clash
      APP_BASE_URL: http://localhost:3000
      API_UPSTREAM_ORIGIN: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # API tests include PostgreSQL-backed challenge tests and require
      # a fully migrated/seeded schema before `pnpm test` starts.
      - name: Fresh PostgreSQL baseline
        run: pnpm db:migrate --through=0000_baseline.sql
      - name: Catalog seed
        run: pnpm db:seed
      - name: PostgreSQL safeguards and advanced challenge schema
        run: pnpm db:migrate
      - name: Advanced challenge curation
        run: pnpm db:seed
      - name: Syntax, domain, authentication, and squad tests
        run: pnpm test
      - name: TypeScript
        run: pnpm typecheck
      - name: API and migration integration tests
        run: pnpm test:integration
      - name: Frontend and backend build
        run: pnpm build
      - name: Web and API proxy smoke
        run: pnpm test:e2e
      - name: ESLint
        run: pnpm lint
