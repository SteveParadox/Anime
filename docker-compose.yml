services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: anime
      POSTGRES_PASSWORD: anime
      POSTGRES_DB: anime_clash
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - anime_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime -d anime_clash"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  anime_postgres:
